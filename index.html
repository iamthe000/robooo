    function addCube(x, y, z, type, direction, colorOverride = null) {
        
        const exists = cubes.some(c => Math.abs(c.position.x - x) < 0.1 && Math.abs(c.position.y - y) < 0.1 && Math.abs(c.position.z - z) < 0.1);
        if(exists) return;

        const geometry = new THREE.BoxGeometry(1, 1, 1);
        let color = 0x00ccff;
        let emissive = 0x000000;

        if (type === 'armor') { color = 0x888888; }
        if (type === 'engine') { color = 0xff3300; emissive = 0x330000; }
        if (type === 'turret') { color = 0xffd700; emissive = 0x332200; }
        if (type === 'triple') { color = 0xffaa00; emissive = 0x332200; }
        if (type === 'cannon') { color = 0x444444; }
        if (type === 'interceptor') { color = 0x00ffaa; emissive = 0x003311; }
        
        if (colorOverride !== null && colorOverride !== undefined) {
            color = colorOverride;
        }

        if (x===0 && y===0 && z===0) color = 0x00ff00; 

        const material = new THREE.MeshStandardMaterial({ 
            color: color, roughness: 0.3, metalness: 0.5, emissive: emissive
        });
        
        const cube = new THREE.Mesh(geometry, material);
        cube.position.set(x, y, z);
        
        let hp = 3;
        if (type === 'armor') hp = 10;
        
        cube.userData = { 
            type: type, 
            direction: direction,
            hp: hp,
            maxHp: hp,
            isDead: false,
            respawnTimer: 0,
            origColor: color
        };

        const edges = new THREE.EdgesGeometry(geometry);
        const line = new THREE.LineSegments(edges, new THREE.LineBasicMaterial({ color: 0x000000, linewidth: 2 }));
        cube.add(line);

        if (type === 'engine' || type === 'turret') {
            let partGeo, partMat, offsetNum;
            if(type === 'engine') {
                partGeo = new THREE.ConeGeometry(0.3, 0.5, 8);
                partMat = new THREE.MeshBasicMaterial({ color: 0x222222 });
                offsetNum = 0.3;
                cube.userData.isEngine = true;
                cube.userData.thrustDir = direction;
            } else {
                partGeo = new THREE.CylinderGeometry(0.1, 0.1, 0.8, 8);
                partMat = new THREE.MeshStandardMaterial({ color: 0xaaaaaa, metalness: 0.8 });
                offsetNum = 0.4;
                cube.userData.isTurret = true;
                cube.userData.fireDir = direction;
            }
            const part = new THREE.Mesh(partGeo, partMat);
            const quaternion = new THREE.Quaternion();
            quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), direction);
            part.setRotationFromQuaternion(quaternion);
            part.position.add(direction.clone().multiplyScalar(offsetNum));
            cube.add(part);
        }

        if (type === 'triple') {
            cube.userData.isTurret = true;
            cube.userData.subType = 'triple';
            cube.userData.fireDir = direction;

            const group = new THREE.Group();
            const quaternion = new THREE.Quaternion();
            quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), direction);
            group.setRotationFromQuaternion(quaternion);
            group.position.add(direction.clone().multiplyScalar(0.2)); 
            
            const partGeo = new THREE.CylinderGeometry(0.08, 0.08, 0.8, 8);
            const partMat = new THREE.MeshStandardMaterial({ color: 0xaaaaaa, metalness: 0.8 });
            
            const positions = [
                {x: 0, y: 0.2, z: -0.15},
                {x: -0.15, y: 0.2, z: 0.1},
                {x: 0.15, y: 0.2, z: 0.1}
            ];

            positions.forEach(pos => {
                const part = new THREE.Mesh(partGeo, partMat);
                part.position.set(pos.x, pos.y, pos.z);
                group.add(part);
            });
            cube.add(group);
        }

        if (type === 'cannon') {
            cube.userData.isTurret = true;
            cube.userData.subType = 'cannon';
            cube.userData.fireDir = direction;

            const group = new THREE.Group();
            const quaternion = new THREE.Quaternion();
            quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), direction);
            group.setRotationFromQuaternion(quaternion);
            group.position.add(direction.clone().multiplyScalar(0.2)); 
            
            // Turret Housing
            const housingGeo = new THREE.BoxGeometry(0.8, 0.5, 0.8);
            const housingMat = new THREE.MeshStandardMaterial({ color: 0x333333, metalness: 0.7, roughness: 0.4 });
            const housing = new THREE.Mesh(housingGeo, housingMat);
            housing.position.y = 0.25;
            group.add(housing);

            // Triple Barrels
            const barrelGeo = new THREE.CylinderGeometry(0.12, 0.12, 1.4, 16);
            const barrelMat = new THREE.MeshStandardMaterial({ color: 0x111111, metalness: 0.9, roughness: 0.2 });
            
            const offsets = [-0.25, 0, 0.25];
            offsets.forEach(offX => {
                const barrel = new THREE.Mesh(barrelGeo, barrelMat);
                barrel.position.set(offX, 0.7, 0); // Extend forward
                group.add(barrel);

                // Barrel Mount/Sleeve
                const sleeveGeo = new THREE.CylinderGeometry(0.16, 0.16, 0.4, 16);
                const sleeve = new THREE.Mesh(sleeveGeo, housingMat);
                sleeve.position.set(offX, 0.4, 0);
                group.add(sleeve);
            });
            
            cube.add(group);
        }

        if (type === 'missile') {
            cube.userData.isTurret = true;
            cube.userData.subType = 'missile';
            cube.userData.fireDir = direction;
            cube.userData.reloadTimer = 0;
            cube.userData.missileReloadTime = 240; // Approx 4s (double normal reload)

            const group = new THREE.Group();
            const quaternion = new THREE.Quaternion();
            quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), direction);
            group.setRotationFromQuaternion(quaternion);
            group.position.add(direction.clone().multiplyScalar(0.2)); 
            
            // Pod Body
            const podGeo = new THREE.BoxGeometry(0.6, 0.6, 0.8);
            const podMat = new THREE.MeshStandardMaterial({ color: 0x444444, metalness: 0.6, roughness: 0.4 });
            const pod = new THREE.Mesh(podGeo, podMat);
            group.add(pod);

            // Tubes (2x2)
            const tubeGeo = new THREE.CylinderGeometry(0.12, 0.12, 0.2, 8);
            const tubeMat = new THREE.MeshBasicMaterial({ color: 0x111111 });
            
            const offsets = [
                {x: -0.15, y: 0.15}, {x: 0.15, y: 0.15},
                {x: -0.15, y: -0.15}, {x: 0.15, y: -0.15}
            ];

            offsets.forEach(off => {
                const tube = new THREE.Mesh(tubeGeo, tubeMat);
                tube.rotation.x = Math.PI / 2;
                tube.position.set(off.x, off.y, 0.4); // Front face
                group.add(tube);
            });

            cube.add(group);
        }

        if (type === 'interceptor') {
            cube.userData.isTurret = true;
            cube.userData.subType = 'interceptor';
            cube.userData.fireDir = direction;

            const group = new THREE.Group();
            const quaternion = new THREE.Quaternion();
            quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), direction);
            group.setRotationFromQuaternion(quaternion);
            group.position.add(direction.clone().multiplyScalar(0.3)); 
            
            // Base
            const baseGeo = new THREE.CylinderGeometry(0.3, 0.3, 0.2, 8);
            const baseMat = new THREE.MeshStandardMaterial({ color: 0x334433, metalness: 0.6 });
            const base = new THREE.Mesh(baseGeo, baseMat);
            group.add(base);

            // Dome/Radar
            const domeGeo = new THREE.SphereGeometry(0.25, 16, 16, 0, Math.PI * 2, 0, Math.PI * 0.5);
            const domeMat = new THREE.MeshStandardMaterial({ color: 0x00ffaa, emissive: 0x004422, roughness: 0.2, metalness: 0.8 });
            const dome = new THREE.Mesh(domeGeo, domeMat);
            dome.position.y = 0.1;
            group.add(dome);
            
            // Small barrels (CIWS style)
            const barrelGeo = new THREE.CylinderGeometry(0.04, 0.04, 0.6, 6);
            const barrelMat = new THREE.MeshStandardMaterial({ color: 0x111111 });
            const barrel = new THREE.Mesh(barrelGeo, barrelMat);
            barrel.rotation.x = Math.PI / 4; // Angled up slightly
            barrel.position.set(0, 0.3, 0.2);
            group.add(barrel);

            cube.add(group);
        }

        robotGroup.add(cube);
        cubes.push(cube);
    }

    let isDragging = false;
    let startX, startY;
    let dragDist = 0;

    function onPointerDown(e) {
        isDragging = true;
        startX = e.clientX;
        startY = e.clientY;
        dragDist = 0;
    }

    function onPointerMove(e) {
        if (!isBattleMode) updateGhostCursor(e);

        if(isDragging) {
            const dx = e.clientX - startX;
            const dy = e.clientY - startY;
            dragDist += Math.abs(dx) + Math.abs(dy);
            
            if (isBattleMode) {
                 const sens = 0.005;
                 robotGroup.rotateY(-dx * sens);
                 robotGroup.rotateX(-dy * sens);
            }
            startX = e.clientX;
            startY = e.clientY;
        }
    }

    function updateGhostCursor(e) {
        mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
        mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
        raycaster.setFromCamera(mouse, camera);
        
        const intersects = raycaster.intersectObjects(cubes);
        if (intersects.length > 0) {
            const intersect = intersects[0];
            const face = intersect.face;
            
            if (currentBlockType === 'delete' || e.shiftKey) {
                 ghostMesh.position.copy(intersect.object.position);
                 ghostMesh.material.color.setHex(0xff0000);
                 ghostMesh.scale.set(1.05, 1.05, 1.05);
            } else {
                 ghostMesh.position.copy(intersect.object.position).add(face.normal);
                 ghostMesh.material.color.setHex(0x00ff00);
                 ghostMesh.scale.set(1, 1, 1);
            }
            ghostMesh.visible = true;
        } else {
            ghostMesh.visible = false;
        }
    }

    function onPointerUp(e) {
        isDragging = false;
        if(dragDist < 10) handleTap(e);
    }

    function handleTap(e) {
        if (isBattleMode) return;
        mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
        mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
        raycaster.setFromCamera(mouse, camera);
        const intersects = raycaster.intersectObjects(cubes);

        if (intersects.length > 0) {
            const intersect = intersects[0];
            const obj = intersect.object;

            const isDelete = currentBlockType === 'delete' || e.shiftKey || e.button === 2;

            if (isDelete) {
                if (obj.position.lengthSq() < 0.1) return;
                
                robotGroup.remove(obj);
                cubes = cubes.filter(c => c !== obj);
                updateGhostCursor(e);
                return;
            }

            const face = intersect.face;
            const newPos = obj.position.clone().add(face.normal);
            
            let override = null;
            if (currentBlockType === 'normal') override = currentBlockColor;
            
            addCube(newPos.x, newPos.y, newPos.z, currentBlockType, face.normal, override);
            updateGhostCursor(e);
        }
    }

    function getInputState() {
        const move = { x: 0, y: 0 };
        const aim = { x: 0, y: 0 };
        let fire = false;
        let boost = false;

        // Gamepad
        if (Math.abs(gamepadVector.x) > 0.1) move.x = gamepadVector.x;
        if (Math.abs(gamepadVector.y) > 0.1) move.y = gamepadVector.y;
        if (Math.abs(gamepadRightVector.x) > 0.1) aim.x = gamepadRightVector.x;
        if (Math.abs(gamepadRightVector.y) > 0.1) aim.y = gamepadRightVector.y;
        if (gamepadFireState.all) fire = true;
        if (isGamepadBoosting) boost = true;

        // Touch
        if (Math.abs(inputVector.x) > 0.01 || Math.abs(inputVector.y) > 0.01) {
            move.x = inputVector.x;
            move.y = inputVector.y;
        }

        // Keyboard
        if (keys['KeyW']) move.y = -1;
        if (keys['KeyS']) move.y = 1;
        if (keys['KeyA']) move.x = -1;
        if (keys['KeyD']) move.x = 1;

        if (keys['ArrowUp']) aim.y = -1;
        if (keys['ArrowDown']) aim.y = 1;
        if (keys['ArrowLeft']) aim.x = -1;
        if (keys['ArrowRight']) aim.x = 1;

        if (keys['Space']) fire = true;
        if (keys['ShiftLeft']) boost = true;

        // Normalize
        const moveLen = Math.sqrt(move.x*move.x + move.y*move.y);
        if (moveLen > 1) { move.x /= moveLen; move.y /= moveLen; }

        const aimLen = Math.sqrt(aim.x*aim.x + aim.y*aim.y);
        if (aimLen > 1) { aim.x /= aimLen; aim.y /= aimLen; }

        return { move, aim, fire, boost };
    }

    function animate() {
        requestAnimationFrame(animate);
        
        if (!isBattleMode && controls) controls.update();

        if (isBattleMode) {
            updateGamepad();
            updateWeapons();
            updateMonitor();

            // Cannon Input Logic
            if (cannonInput.isHolding && !cannonInput.volleyActive) {
                 if (Date.now() - cannonInput.pressTime > 300) {
                     attemptFireCannon('volley');
                     cannonInput.volleyActive = true; 
                 }
            }

            // Process Volley Queue
            if (cannonInput.volleyQueue > 0) {
                cannonInput.volleyTimer++;
                if (cannonInput.volleyTimer > 8) { 
                    fireBullet('cannon'); 
                    cannonInput.volleyQueue--;
                    cannonInput.volleyTimer = 0;
                }
            }

            const input = getInputState();

            // Auto Interception Logic
            updateInterceptors();

            const fireAll = input.fire || inputState.fireAll; // Combined fire
            const fireNormal = inputState.fireNormal || gamepadFireState.normal;
            const fireTriple = inputState.fireTriple || gamepadFireState.triple;
            const fireMissile = inputState.fireMissile || gamepadFireState.missile;
            
            if (fireAll) {
                attemptFire('normal');
                attemptFire('triple');
                attemptFire('missile');
            }
            if (fireNormal) attemptFire('normal');
            if (fireTriple) attemptFire('triple');
            if (fireMissile) attemptFire('missile');

            // Physics Constants
            const moveAccel = 0.15;
            const friction = 0.95;
            const rotAccel = 0.1;
            const maxRotSpeed = 0.05;

            // Movement
            let mx = input.move.x;
            let my = input.move.y;
            const moveDir = new THREE.Vector3(mx, 0, my);
            moveDir.applyQuaternion(robotGroup.quaternion);
            velocity.add(moveDir.multiplyScalar(moveAccel));
            velocity.multiplyScalar(friction);

            // Rotation
            const rx = input.aim.x;
            const ry = input.aim.y;
            const targetYaw = -rx * maxRotSpeed;
            const targetPitch = -ry * maxRotSpeed;
            
            currentAngularVelocity.y += (targetYaw - currentAngularVelocity.y) * rotAccel;
            currentAngularVelocity.x += (targetPitch - currentAngularVelocity.x) * rotAccel;

            robotGroup.rotateY(currentAngularVelocity.y);
            robotGroup.rotateX(currentAngularVelocity.x);

            if (input.boost || isBoosting) {
                let totalThrust = new THREE.Vector3(0,0,0);
                cubes.forEach(c => {
                    if (c.userData.isEngine) {
                        if (c.userData.isDead) return;
                        
                        const forceDir = c.userData.thrustDir.clone().applyQuaternion(robotGroup.quaternion).negate();
                        totalThrust.add(forceDir);
                        
                        const worldPos = c.position.clone().applyMatrix4(robotGroup.matrixWorld);
                        const exhaustDir = forceDir.clone().negate();

                        // Jet flame
                        if(Math.random()>0.1) {
                             createParticle(worldPos, exhaustDir.clone().multiplyScalar(0.8), 0x00ffff, 0.3, 10, 'normal');
                        }
                        
                        // Smoke
                        if(Math.random()>0.7) {
                             createParticle(worldPos, exhaustDir.clone().multiplyScalar(0.2), 0x555555, 0.5, 50, 'smoke');
                        }
                    }
                });
                velocity.add(totalThrust.normalize().multiplyScalar(0.06));
                shakeIntensity = Math.min(shakeIntensity + 0.02, 0.5);
            }

            robotGroup.position.add(velocity);

            if (dust && dust.visible) {
                const positions = dust.geometry.attributes.position.array;
                const range = 60;
                const rangeSq = range * range;
                const cx = camera.position.x;
                const cy = camera.position.y;
                const cz = camera.position.z;
                
                const forward = new THREE.Vector3(0,0,-1).applyQuaternion(camera.quaternion);
                const fx = forward.x * range * 0.8;
                const fy = forward.y * range * 0.8;
                const fz = forward.z * range * 0.8;

                for(let i=0; i<positions.length; i+=3) {
                    const dx = positions[i] - cx;
                    const dy = positions[i+1] - cy;
                    const dz = positions[i+2] - cz;
                    
                    if (dx*dx + dy*dy + dz*dz > rangeSq) {
                        positions[i] = cx + fx + (Math.random()-0.5)*range;
                        positions[i+1] = cy + fy + (Math.random()-0.5)*range;
                        positions[i+2] = cz + fz + (Math.random()-0.5)*range;
                    }
                }
                dust.geometry.attributes.position.needsUpdate = true;
            }

            const offset = new THREE.Vector3(0, 15, 30);
            offset.applyQuaternion(robotGroup.quaternion);
            const targetPos = robotGroup.position.clone().add(offset);
            
            camera.position.lerp(targetPos, 0.1);

            // Dynamic FOV
            const speed = velocity.length();
            const targetFOV = 75 + speed * 5; 
            camera.fov += (targetFOV - camera.fov) * 0.1;
            camera.updateProjectionMatrix();
            
            camera.up.set(0, 1, 0).applyQuaternion(robotGroup.quaternion);
            camera.lookAt(robotGroup.position);

            spawnTimer++;
            if (spawnTimer > currentDifficulty.spawnRate && enemies.length < currentDifficulty.maxEnemies) {
                const rx = (Math.random() - 0.5) * 100;
                const rz = -40 - Math.random() * 60;
                spawnEnemy(rx, (Math.random()-0.5)*20, rz);
                spawnTimer = 0;
            }

            enemies.forEach(e => {
                e.group.lookAt(robotGroup.position);
                const dist = e.group.position.distanceTo(robotGroup.position);
                if (dist > 15) {
                    e.group.translateZ(0.03);
                }
                
                e.fireTimer++;
                const limit = e.fireInterval || currentDifficulty.fireInterval;
                if (e.fireTimer > limit) {
                    fireBullet(false, e.group, e.cubes);
                    e.fireTimer = Math.random() * 50;
                }
            });

            for (let i = bullets.length - 1; i >= 0; i--) {
                const b = bullets[i];

                if (b.userData.isMissile) {
                    // Homing Logic
                    if (b.userData.homingDelay > 0) {
                        b.userData.homingDelay--;
                        b.userData.vel.multiplyScalar(0.95); // Drag phase
                        b.quaternion.setFromUnitVectors(new THREE.Vector3(0,0,1), b.userData.vel.clone().normalize());
                    } else {
                        if (!b.userData.target || (b.userData.target.parent === null && b.userData.target !== robotGroup)) {
                            b.userData.target = findNearestEnemy(b.position, b.userData.isPlayer);
                        }
                        
                        if (b.userData.target) {
                            const targetPos = b.userData.target.position.clone();
                            const dist = targetPos.distanceTo(b.position);
                            const desiredDir = targetPos.sub(b.position).normalize();
                            const currentDir = b.userData.vel.clone().normalize();
                            
                            // Calculate angle to target
                            const dot = currentDir.dot(desiredDir); // 1.0 = forward, 0 = side, -1 = behind

                            // Dynamic turn rate
                            let turnRate = b.userData.turnRate || 0.12;
                            let maxSpeed = b.userData.maxSpeed || 2.0;
                            
                            // Aggressive Homing (Close Range)
                            // If we are close (< 30.0), scale turn rate up and speed down based on proximity
                            if (dist < 30.0) {
                                const proximityFactor = (30.0 - dist) / 30.0; // 0.0 (far) -> 1.0 (close)
                                
                                // Increase turn rate significantly as we get closer
                                // Base 0.12 -> Max ~0.5
                                turnRate += proximityFactor * 0.4;
                                
                                // Decrease max speed significantly as we get closer
                                // Base 2.0 -> Min ~0.8
                                maxSpeed = 2.0 - (proximityFactor * 1.2);
                                
                                // Extra brake if angle is wide (orbiting prevention)
                                if (dot < 0.5) {
                                    turnRate += 0.2; 
                                    maxSpeed *= 0.7;
                                }
                            }

                            // Steer
                            const steer = desiredDir.sub(currentDir).multiplyScalar(turnRate);
                            const newDir = currentDir.add(steer).normalize();
                            
                            // Accelerate / Decelerate
                            let speed = b.userData.vel.length();
                            if (speed < maxSpeed) {
                                speed *= (b.userData.accel || 1.05);
                            } else {
                                // Strong braking if over speed in close quarters
                                speed *= (dist < 20.0) ? 0.85 : 0.95; 
                            }
                            if (speed < 0.4) speed = 0.4; // Minimum speed to prevent stop

                            b.userData.vel.copy(newDir.multiplyScalar(speed));
                            b.quaternion.setFromUnitVectors(new THREE.Vector3(0,0,1), newDir);
                        }
                    }
                    
                    // Smoke Trail - cleaner
                    createParticle(b.position, new THREE.Vector3(0,0,0), 0xaaaaaa, 0.2, 40, 'smoke');
                }

                b.position.add(b.userData.vel);
                b.userData.life--;

                if (b.userData.life <= 0) {
                    scene.remove(b);
                    bullets.splice(i, 1);
                    continue;
                }

                if (b.userData.isPlayer) {
                    let hitEnemy = false;
                    
                    // Interceptor Logic: Check for collision with ENEMY BULLETS (Missiles)
                    if (b.userData.isInterceptor) {
                        for (let k = bullets.length - 1; k >= 0; k--) {
                            const enemyBullet = bullets[k];
                            // Must be enemy, missile, and alive
                            if (!enemyBullet.userData.isPlayer && enemyBullet.userData.isMissile) {
                                if (enemyBullet.position.distanceTo(b.position) < 1.0) {
                                    // Hit! Destroy both
                                    createParticle(b.position, new THREE.Vector3(0,0,0), 0x00ffaa, 0.5, 10, 'explosion');
                                    createExplosion(enemyBullet.position, 0xff0000, 0.5); // Small explosion for missile
                                    
                                    // Mark enemy bullet for death (don't splice here to avoid index shift)
                                    enemyBullet.userData.life = 0;
                                    enemyBullet.visible = false;
                                    
                                    hitEnemy = true; // Signals caller to remove 'b' (interceptor bullet)
                                    break;
                                }
                            }
                        }
                    }

                    if (!hitEnemy) {
                        for (let k = enemies.length - 1; k >= 0; k--) {
                            const enemy = enemies[k];
                            for (let j = enemy.cubes.length - 1; j >= 0; j--) {
                                const c = enemy.cubes[j];
                                const worldPos = c.position.clone().applyMatrix4(enemy.group.matrixWorld);
                                if (worldPos.distanceTo(b.position) < 0.8) {
                                    createParticle(worldPos, b.userData.vel.clone().multiplyScalar(0.2), 0xffffff, 0.3, 5, 'explosion'); // Hit flash
                                    
                                    // Interceptor does ZERO damage to ships (or minimal visual only)
                                    if (b.userData.isInterceptor) {
                                        hitEnemy = true; // Remove bullet
                                        // Maybe just a spark
                                        createParticle(worldPos, b.userData.vel.clone().multiplyScalar(-0.1), 0x00ffaa, 0.2, 5);
                                        break; 
                                    }

                                    if (b.userData.isMissile) {
                                        // Missile Logic: Large AOE but Half Damage
                                        createExplosion(worldPos, 0xff00ff, 3.0); 
                                        
                                        const impactPos = worldPos.clone();
                                        const radius = 6.0; // Large radius

                                        // Iterate backwards
                                        for (let m = enemy.cubes.length - 1; m >= 0; m--) {
                                            const tCube = enemy.cubes[m];
                                            const tPos = tCube.position.clone().applyMatrix4(enemy.group.matrixWorld);
                                            
                                            if (tPos.distanceTo(impactPos) < radius) {
                                                // Half Damage
                                                tCube.userData.hp = Math.floor(tCube.userData.hp / 2);
                                                
                                                createParticle(tPos, new THREE.Vector3(0,0,0), tCube.material.color.getHex(), 0.4, 20, 'smoke');

                                                if (tCube.userData.hp <= 0) {
                                                    createExplosion(tPos, tCube.material.color.getHex(), 0.8);
                                                    enemy.group.remove(tCube);
                                                    enemy.cubes.splice(m, 1);
                                                    
                                                    if (tCube.userData.type === 'core') {
                                                        createExplosion(enemy.group.position, 0xffa500, 2.5);
                                                        scene.remove(enemy.group);
                                                        enemies.splice(k, 1);
                                                        hitEnemy = true;
                                                        break; 
                                                    }
                                                } else {
                                                    const orig = tCube.material.color.getHex();
                                                    tCube.material.color.setHex(0xffffff);
                                                    setTimeout(()=>{ if(tCube.parent) tCube.material.color.setHex(orig); }, 50);
                                                }
                                            }
                                        }
                                        hitEnemy = true;
                                        break;
                                    } else {
                                        if (c.userData.type === 'core') {
                                            createExplosion(enemy.group.position, 0xffa500, 2.5); 
                                            scene.remove(enemy.group);
                                            enemies.splice(k, 1);
                                            hitEnemy = true;
                                            break;
                                        }

                                        c.userData.hp = (c.userData.hp || 1) - 1;
                                        
                                        if (c.userData.hp <= 0) {
                                            let exScale = 0.8;
                                            if (b.userData.isCannon) exScale = 4.0;

                                            createExplosion(worldPos, c.material.color.getHex(), exScale); 

                                            if (b.userData.isCannon) {
                                                const impactPos = worldPos.clone();
                                                const radius = 2.5; 
                                                
                                                for (let m = enemy.cubes.length - 1; m >= 0; m--) {
                                                    const targetCube = enemy.cubes[m];
                                                    if (targetCube === c) {
                                                        enemy.group.remove(c);
                                                        enemy.cubes.splice(m, 1);
                                                        continue;
                                                    }
                                                    
                                                    const tPos = targetCube.position.clone().applyMatrix4(enemy.group.matrixWorld);
                                                    if (tPos.distanceTo(impactPos) <= radius) {
                                                        createParticle(tPos, new THREE.Vector3(0,0,0), targetCube.material.color.getHex(), 0.5, 20, 'normal');
                                                        enemy.group.remove(targetCube);
                                                        enemy.cubes.splice(m, 1);
                                                    }
                                                }
                                            } else {
                                                enemy.group.remove(c);
                                                enemy.cubes.splice(j, 1);
                                            }
                                        } else {
                                            const orig = c.material.color.getHex();
                                            c.material.color.setHex(0xffffff);
                                            setTimeout(()=>{ if(c.parent) c.material.color.setHex(orig); }, 50);
                                        }

                                        hitEnemy = true;
                                        break;
                                    }
                                }
                            }
                            if (hitEnemy) break;
                        }
                    }
                    if (hitEnemy) {
                        scene.remove(b);
                        bullets.splice(i, 1);
                        // Fix for splice issue when removing bullet being iterated?
                        // "i" is from outer loop: for (let i = bullets.length - 1; i >= 0; i--)
                        // This splice removes 'b'. 
                        // But if we ALSO removed an enemy bullet in the nested loop, we modified 'bullets'.
                        // wait, "enemyBullet" is inside "bullets" array too.
                        // If I remove enemyBullet (index k), and k > i, it's fine.
                        // If k < i, then i shifts. 
                        // But i is iterating backwards. k is also iterating backwards.
                        // If I remove k, indices > k shift down.
                        // If k > i, 'i' is unaffected.
                        // If k < i, 'i' index now points to element i-1. Since we do i--, it skips one? No.
                        // If I remove at k (where k < i), element at i becomes element at i-1.
                        // Next loop i-- accesses i-1 (which is the old i). So we visit 'old i' again?
                        // Let's trace. 
                        // i=5 (current). k=2 (target). splice(2,1). Length decreases. index 5 becomes 4.
                        // Next loop i=4. We process new 4 (which was old 5). We processed old 5 already!
                        // So we process same bullet twice?
                        // This could be problematic if logic is not idempotent.
                        // Bullet logic is usually "move, check collision". If run twice in one frame, it moves twice? No, movement is already done. Collision is checked twice.
                        // If we remove 'b' (at i) via splice(i,1), we continue.
                        
                        // To be safe, if we remove `enemyBullet`, we should probably adjust `i` if `k < i`.
                        // But wait, `bullets` contains BOTH player and enemy bullets.
                        // If I modify the array I'm iterating over (bullets), I need to be careful.
                        
                        // Simpler solution: Mark enemy bullet as dead (life=0) instead of splicing immediately inside nested loop.
                        // Let the main loop handle removal.
                    }
                } else {
                    let hit = false;
                    for (let j = cubes.length - 1; j >= 0; j--) {
                        const c = cubes[j];
                        if (c.userData.isDead) continue; 
                        
                        const worldPos = c.position.clone().applyMatrix4(robotGroup.matrixWorld);
                        if (worldPos.distanceTo(b.position) < 0.8) {
                            createParticle(worldPos, b.userData.vel.clone().multiplyScalar(0.2), 0xffffff, 0.3, 5, 'explosion'); // Hit Flash
                            
                            if (c.position.lengthSq() < 0.1) { 
                                playerHP -= 10;
                                document.getElementById('hp-display').innerText = "HP: " + playerHP;
                                shakeIntensity += 0.4;
                                if (playerHP <= 0) {
                                    createExplosion(robotGroup.position, 0x00ff00, 3.0);
                                    alert("GAME OVER");
                                    toggleMode();
                                    return;
                                }
                            } else {
                                c.userData.hp -= 1;
                                if (c.userData.hp <= 0) {
                                    createExplosion(worldPos, c.material.color.getHex(), 0.8);
                                    c.visible = false;
                                    c.userData.isDead = true;
                                    c.userData.respawnTimer = 300; 
                                } else {
                                    c.material.color.setHex(0xffffff);
                                    setTimeout(() => { if(!c.userData.isDead) c.material.color.setHex(c.userData.origColor); }, 100);
                                }
                            }
                            hit = true;
                            break;
                        }
                    }
                    if (hit) {
                        scene.remove(b);
                        bullets.splice(i, 1);
                    }
                }
            }

            if (shakeIntensity > 0) {
                const shakeOffset = new THREE.Vector3((Math.random()-0.5)*shakeIntensity, (Math.random()-0.5)*shakeIntensity, (Math.random()-0.5)*shakeIntensity);
                camera.position.add(shakeOffset);
                shakeIntensity *= 0.9;
                if(shakeIntensity < 0.1) shakeIntensity = 0;
            }

            particles.forEach((p, i) => {
                p.position.add(p.userData.vel);
                p.userData.life--;
                
                if (p.userData.type === 'smoke') {
                    p.scale.multiplyScalar(1.03);
                    p.material.opacity = (p.userData.life / p.userData.maxLife) * 0.5;
                    p.position.y += 0.02; 
                } else if (p.userData.type === 'explosion') {
                    p.scale.multiplyScalar(1.1);
                    p.material.opacity = (p.userData.life / p.userData.maxLife);
                } else {
                    p.material.opacity = p.userData.life / p.userData.maxLife;
                }

                if(p.userData.life <= 0){ scene.remove(p); particles.splice(i,1); }
            });
            
            cubes.forEach(c => {
                // Update Reload Timer
                if (c.userData.reloadTimer > 0) c.userData.reloadTimer--;

                if (c.userData.isDead) {
                    c.userData.respawnTimer--;
                    if (c.userData.respawnTimer <= 0) {
                        c.visible = true;
                        c.userData.isDead = false;
                        c.userData.hp = c.userData.maxHp;
                        c.material.color.setHex(c.userData.origColor);
                        const worldPos = c.position.clone().applyMatrix4(robotGroup.matrixWorld);
                        createParticle(worldPos, new THREE.Vector3(0,0,0), 0x00ff00, 0.5, 30);
                    }
                } else if (c.userData.hp < c.userData.maxHp) {
                    const damageRatio = 1.0 - (c.userData.hp / c.userData.maxHp);
                    if(Math.random() < damageRatio * 0.1) {
                         const worldPos = c.position.clone().applyMatrix4(robotGroup.matrixWorld);
                         const smokeDir = new THREE.Vector3(Math.random()-0.5, Math.random()*0.5 + 0.2, Math.random()-0.5).normalize().multiplyScalar(0.05);
                         createParticle(worldPos, smokeDir, 0x222222, 0.6, 90, 'smoke');
                    }
                }
            });
        }
        
        // Render Pipeline
        renderer.clear();
        
        // 1. Main Scene
        renderer.setViewport(0, 0, window.innerWidth, window.innerHeight);
        renderer.render(scene, camera);

        // 2. HUD (Battle Mode only)
        if (isBattleMode) {
            renderer.clearDepth(); // Clear depth so HUD renders on top
            
            const hudSize = 120;
            const padding = 20;
            const topBarHeight = 60; // 50px + padding
            
            const x = padding;
            const y = window.innerHeight - hudSize - topBarHeight;
            
            renderer.setScissorTest(true);
            renderer.setScissor(x, y, hudSize, hudSize);
            renderer.setViewport(x, y, hudSize, hudSize);
            
            renderer.render(sceneHUD, cameraHUD);
            
            renderer.setScissorTest(false);
        }
    }

    function setupJoystick() {
        const area = document.getElementById('stick-area');
        const knob = document.getElementById('stick-knob');
        let start = {x:0, y:0};
        area.addEventListener('touchstart', e => { e.preventDefault(); start.x = e.touches[0].clientX; start.y = e.touches[0].clientY; }, {passive:false});
        area.addEventListener('touchmove', e => {
            e.preventDefault();
            const t = e.touches[0];
            let dx = t.clientX - start.x, dy = t.clientY - start.y;
            const dist = Math.sqrt(dx*dx + dy*dy), max = 45;
            if(dist>max) { dx = dx/dist*max; dy = dy/dist*max; }
            knob.style.transform = `translate(${dx}px, ${dy}px)`;
            inputVector = { x: dx/max, y: dy/max };
        }, {passive:false});
        area.addEventListener('touchend', e => { e.preventDefault(); knob.style.transform = `translate(0,0)`; inputVector = { x: 0, y: 0 }; });
    }

    function setupButtons() {
        const boostBtn = document.getElementById('boost-btn');
        const fireBtn = document.getElementById('fire-btn');
        const normalBtn = document.getElementById('normal-btn');
        const tripleBtn = document.getElementById('triple-btn');
        const missileBtn = document.getElementById('missile-btn');

        const setPress = (el, val) => {
            el.addEventListener('touchstart', e=>{e.preventDefault(); val(true)}, {passive:false});
            el.addEventListener('touchend', e=>{e.preventDefault(); val(false)});
            el.addEventListener('mousedown', ()=>val(true));
            el.addEventListener('mouseup', ()=>val(false));
            el.addEventListener('mouseleave', ()=>val(false));
        };
        setPress(boostBtn, v => isBoosting = v);
        
        setPress(fireBtn, v => inputState.fireAll = v);
        setPress(normalBtn, v => inputState.fireNormal = v);
        setPress(tripleBtn, v => inputState.fireTriple = v);
        setPress(missileBtn, v => inputState.fireMissile = v);

        const cannonBtn = document.getElementById('cannon-btn');
        if (cannonBtn) {
            const startPress = (e) => {
                e.preventDefault();
                cannonInput.isHolding = true;
                cannonInput.pressTime = Date.now();
                cannonInput.volleyActive = false;
            };
            const endPress = (e) => {
                e.preventDefault();
                if (cannonInput.isHolding) {
                    cannonInput.isHolding = false;
                    const duration = Date.now() - cannonInput.pressTime;
                    if (duration < 300 && !cannonInput.volleyActive) {
                        attemptFireCannon('single');
                    }
                }
            };
            
            cannonBtn.addEventListener('touchstart', startPress, {passive:false});
            cannonBtn.addEventListener('mousedown', startPress);
            cannonBtn.addEventListener('touchend', endPress);
            cannonBtn.addEventListener('mouseup', endPress);
            cannonBtn.addEventListener('mouseleave', endPress);
        }
    }

    function updateGamepad() {
        const gamepads = navigator.getGamepads ? navigator.getGamepads() : [];
        if (!gamepads) return;
        const gp = gamepads[0];
        if (!gp) return;

        // Left Stick (Move)
        gamepadVector.x = Math.abs(gp.axes[0]) > 0.1 ? gp.axes[0] : 0;
        gamepadVector.y = Math.abs(gp.axes[1]) > 0.1 ? gp.axes[1] : 0;

        // Right Stick (Camera)
        gamepadRightVector.x = Math.abs(gp.axes[2]) > 0.1 ? gp.axes[2] : 0;
        gamepadRightVector.y = Math.abs(gp.axes[3]) > 0.1 ? gp.axes[3] : 0;

        // Buttons
        // 0: A/Cross -> Boost
        isGamepadBoosting = gp.buttons[0].pressed;

        // 7: R2/RT -> All Fire
        // 5: R1/RB -> Normal Fire
        // 4: L1/LB -> Triple Fire
        // 6: L2/LT -> Missile Fire
        gamepadFireState.all = gp.buttons[7].pressed;
        gamepadFireState.normal = gp.buttons[5].pressed;
        gamepadFireState.triple = gp.buttons[4].pressed;
        gamepadFireState.missile = gp.buttons[6].pressed;

        // Save state (only needed if we need edges, but currently not needed for continuous fire)
        for (let i = 0; i < gp.buttons.length; i++) {
            prevGamepadButtons[i] = gp.buttons[i].pressed;
        }
    }

    function findNearestEnemy(pos, isPlayer) {
        let nearest = null;
        let minDist = Infinity;

        if (isPlayer) {
            enemies.forEach(e => {
                const dist = e.group.position.distanceTo(pos);
                if (dist < minDist) {
                    minDist = dist;
                    nearest = e.group;
                }
            });
        } else {
            nearest = robotGroup;
        }
        return nearest;
    }

    function fireBullet(targetTypeOrIsPlayer = true, sourceGroup = null, sourceCubes = null) {
        if(!isBattleMode) return;

        // 引数の解釈を調整
        let isPlayer = true;
        let targetType = 'all';
        let firingGroup = robotGroup;
        let firingCubes = cubes;

        if (typeof targetTypeOrIsPlayer === 'string') {
            // プレイヤーからの発射 (ボタン経由)
            isPlayer = true;
            targetType = targetTypeOrIsPlayer;
            firingGroup = robotGroup;
            firingCubes = cubes;
        } else {
            // 敵または汎用的な呼び出し
            isPlayer = targetTypeOrIsPlayer;
            targetType = 'all';
            firingGroup = isPlayer ? robotGroup : sourceGroup;
            firingCubes = isPlayer ? cubes : sourceCubes;
        }
        
        const color = isPlayer ? 0xffff00 : 0xff00ff;

        firingCubes.forEach(c => {
            if (c.userData.isTurret) {
                if (c.userData.isDead) return;
                
                // 発射対象のフィルタリング
                const isTriple = (c.userData.subType === 'triple');
                const isMissile = (c.userData.subType === 'missile');
                const isCannon = (c.userData.subType === 'cannon');

                if (targetType === 'normal' && (isTriple || isMissile || isCannon)) return;
                if (targetType === 'triple' && !isTriple) return;
                if (targetType === 'missile' && !isMissile) return;
                if (targetType === 'cannon' && !isCannon) return;

                const fireDir = c.userData.fireDir.clone().applyQuaternion(firingGroup.quaternion).normalize();
                
                if (isCannon) {
                    const spawnPos = c.position.clone().applyMatrix4(firingGroup.matrixWorld).add(fireDir.clone().multiplyScalar(1.0));
                    
                    const shellGeo = new THREE.SphereGeometry(0.35, 8, 8);
                    const shellMat = new THREE.MeshBasicMaterial({ color: 0xffddaa }); // Hot metal
                    const shell = new THREE.Mesh(shellGeo, shellMat);
                    shell.position.copy(spawnPos);
                    
                    shell.userData = { 
                        vel: fireDir.clone().multiplyScalar(3.0), // Fast
                        life: 150, 
                        isPlayer: isPlayer, 
                        isCannon: true 
                    };
                    scene.add(shell);
                    bullets.push(shell);

                    // Recoil logic: Strong push back (Increased)
                    if (isPlayer) {
                        const recoilForce = fireDir.clone().negate().multiplyScalar(0.4); 
                        velocity.add(recoilForce);
                        shakeIntensity += 0.5;
                    }

                    // Intense Smoke
                    for(let i=0; i<8; i++) {
                         const sDir = fireDir.clone().multiplyScalar(0.5 + Math.random()*0.5);
                         createParticle(spawnPos, sDir, 0x333333, 0.6 + Math.random()*0.4, 40 + Math.random()*20, 'smoke');
                    }
                    
                    // Intense Sparks
                    for(let i=0; i<12; i++) {
                         const sDir = fireDir.clone().add(new THREE.Vector3((Math.random()-0.5)*0.8, (Math.random()-0.5)*0.8, (Math.random()-0.5)*0.8)).normalize().multiplyScalar(1.0 + Math.random()*1.0);
                         createParticle(spawnPos, sDir, 0xffaa00, 0.15, 10 + Math.random()*10, 'normal');
                    }
                    return;

                } else if (isMissile) {
                    if (c.userData.reloadTimer > 0) return;
                    c.userData.reloadTimer = c.userData.missileReloadTime; // Set reload timer

                    const spawnPos = c.position.clone().applyMatrix4(firingGroup.matrixWorld).add(fireDir.clone().multiplyScalar(0.6));
                    const missileGeo = new THREE.BoxGeometry(0.2, 0.2, 0.6);
                    const missile = new THREE.Mesh(missileGeo, new THREE.MeshBasicMaterial({ color: color }));
                    missile.position.copy(spawnPos);
                    
                    // Spread logic
                    const spread = new THREE.Vector3((Math.random()-0.5), (Math.random()-0.5), (Math.random()-0.5)).multiplyScalar(0.8);
                    const launchDir = fireDir.clone().add(spread).normalize();

                    // Look at fire direction
                    const targetQ = new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0,0,1), launchDir);
                    missile.quaternion.copy(targetQ);

                    missile.userData = { 
                        vel: launchDir.multiplyScalar(0.8), // Start with ejection speed
                        maxSpeed: 2.0,
                        turnRate: 0.12, // Smoother turns
                        accel: 1.05,
                        life: 300, 
                        homingDelay: 15, // Fly straight first
                        isPlayer: isPlayer, 
                        isMissile: true,
                        target: findNearestEnemy(spawnPos, isPlayer)
                    };
                    scene.add(missile);
                    bullets.push(missile);

                    createParticle(spawnPos, fireDir.clone().multiplyScalar(0.2), 0xaaaaaa, 0.5, 20, 'smoke');
                    return;

                } else if (isTriple) {
                    const q = new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0, 1, 0), c.userData.fireDir);
                    const worldQ = firingGroup.quaternion.clone().multiply(q);
                    
                    const localOffsets = [
                        new THREE.Vector3(0, 0.4, -0.15), 
                        new THREE.Vector3(-0.15, 0.4, 0.1), 
                        new THREE.Vector3(0.15, 0.4, 0.1)
                    ];
                    
                    localOffsets.forEach(off => {
                         const worldOffset = off.clone().applyQuaternion(worldQ);
                         const spawnPos = c.position.clone().applyMatrix4(firingGroup.matrixWorld).add(worldOffset);
                         
                         const bullet = new THREE.Mesh(new THREE.SphereGeometry(0.2), new THREE.MeshBasicMaterial({ color: color }));
                         bullet.position.copy(spawnPos);
                         bullet.userData = { vel: fireDir.clone().multiplyScalar(2.0), life: 120, isPlayer: isPlayer };
                         scene.add(bullet);
                         bullets.push(bullet);
                         createParticle(bullet.position, fireDir.clone().multiplyScalar(0.5), color, 0.3, 10);
                    });
                } else {
                    const worldPos = c.position.clone().applyMatrix4(firingGroup.matrixWorld);
                    const bullet = new THREE.Mesh(new THREE.SphereGeometry(0.3), new THREE.MeshBasicMaterial({ color: color }));
                    bullet.position.copy(worldPos).add(fireDir.clone().multiplyScalar(0.8));
                    bullet.userData = { vel: fireDir.multiplyScalar(2.0), life: 120, isPlayer: isPlayer };
                    scene.add(bullet);
                    bullets.push(bullet);
                    createParticle(bullet.position, fireDir.multiplyScalar(0.5), color, 0.4, 10);
                }
            }
        });
    }
    
    function createParticle(pos, dir, color=0xffaa00, size=0.2, life=20, type='normal') {
        const elm = new THREE.Mesh(new THREE.BoxGeometry(size, size, size), new THREE.MeshBasicMaterial({color:color, transparent:true, opacity:0.8}));
        elm.position.copy(pos);
        
        let spreadVal = 0.2;
        if(type === 'smoke') spreadVal = 0.1;
        if(type === 'explosion') spreadVal = 0.5;

        const spread = new THREE.Vector3((Math.random()-0.5)*spreadVal, (Math.random()-0.5)*spreadVal, (Math.random()-0.5)*spreadVal);
        elm.userData = { vel: dir.clone().add(spread), life: life, maxLife:life, type: type };
        scene.add(elm);
        particles.push(elm);
    }

    function createExplosion(pos, color, scale = 1.0) {
        // Flash
        createParticle(pos, new THREE.Vector3(0,0,0), 0xffffff, 2.0 * scale, 5, 'explosion');
        
        // Debris
        const debrisCount = Math.floor(15 * scale);
        for(let i=0; i<debrisCount; i++) {
             const dir = new THREE.Vector3(Math.random()-0.5, Math.random()-0.5, Math.random()-0.5).normalize().multiplyScalar(0.4 * scale);
             createParticle(pos, dir, color, 0.3 * scale, 40, 'normal');
        }

        // Smoke
        const smokeCount = Math.floor(8 * scale);
        for(let i=0; i<smokeCount; i++) {
             const dir = new THREE.Vector3(Math.random()-0.5, Math.random()*0.5, Math.random()-0.5).normalize().multiplyScalar(0.15 * scale);
             createParticle(pos, dir, 0x555555, 0.8 * scale, 70, 'smoke');
        }

        shakeIntensity += 0.2 * scale;
    }

    function getEnemyLayout(type) {
        const core = {x:0, y:0, z:0, type:'core', dir:new THREE.Vector3(0,0,1)};
        const engine = {x:0, y:0, z:-1, type:'engine', dir:new THREE.Vector3(0,0,-1)};
        
        if (type === 'easy') {
            return [
                core, engine,
                {x:0, y:1, z:0, type:'turret', dir:new THREE.Vector3(0,1,0)}
            ];
        } else if (type === 'hard') {
            return [
                core, engine,
                // Front Armor Shield
                {x:0, y:0, z:1, type:'armor', dir:new THREE.Vector3(0,0,1)},
                {x:1, y:0, z:1, type:'armor', dir:new THREE.Vector3(0,0,1)},
                {x:-1, y:0, z:1, type:'armor', dir:new THREE.Vector3(0,0,1)},
                {x:0, y:1, z:1, type:'armor', dir:new THREE.Vector3(0,0,1)},
                {x:0, y:-1, z:1, type:'armor', dir:new THREE.Vector3(0,0,1)},
                // Shoulder Missiles
                {x:1, y:1, z:0, type:'missile', dir:new THREE.Vector3(0,0,1)},
                {x:-1, y:1, z:0, type:'missile', dir:new THREE.Vector3(0,0,1)},
                // Wing Triples
                {x:2, y:0, z:0, type:'triple', dir:new THREE.Vector3(0,0,1)},
                {x:-2, y:0, z:0, type:'triple', dir:new THREE.Vector3(0,0,1)}
            ];
        } else {
            return [
                core, engine,
                {x:1, y:0, z:0, type:'normal', dir:new THREE.Vector3(1,0,0)},
                {x:-1, y:0, z:0, type:'normal', dir:new THREE.Vector3(-1,0,0)},
                {x:1, y:0, z:1, type:'turret', dir:new THREE.Vector3(0,0,1)},
                {x:-1, y:0, z:1, type:'turret', dir:new THREE.Vector3(0,0,1)},
                {x:0, y:1, z:0, type:'normal', dir:new THREE.Vector3(0,1,0)},
                {x:0, y:-1, z:0, type:'normal', dir:new THREE.Vector3(0,-1,0)}
            ];
        }
    }

    function spawnEnemy(x, y, z) {
        const group = new THREE.Group();
        const cubesArr = [];
        scene.add(group);
        group.position.set(x, y, z);
        group.lookAt(robotGroup.position);

        const blocks = getEnemyLayout(currentDifficulty.enemyType);

        blocks.forEach(b => {
            const geometry = new THREE.BoxGeometry(1, 1, 1);
            let color = 0xff0000; 
            let emissive = 0x330000;

            if (b.type === 'core') { color = 0x00ff00; emissive = 0x003300; }
            if (b.type === 'engine') { color = 0xff3300; emissive = 0x330000; }
            if (b.type === 'turret') { color = 0xffd700; emissive = 0x332200; }
            if (b.type === 'armor') { color = 0x888888; emissive = 0x000000; }
            if (b.type === 'missile') { color = 0x444444; emissive = 0x000000; }

            const material = new THREE.MeshStandardMaterial({ 
                color: color, roughness: 0.3, metalness: 0.5, emissive: emissive
            });
            
            const cube = new THREE.Mesh(geometry, material);
            cube.position.set(b.x, b.y, b.z);
            
            let hp = 3;
            if (b.type === 'armor') hp = 10;
            
            cube.userData = { 
                type: b.type, 
                direction: b.dir,
                hp: hp,
                maxHp: hp
            };

            const edges = new THREE.EdgesGeometry(geometry);
            const line = new THREE.LineSegments(edges, new THREE.LineBasicMaterial({ color: 0x000000, linewidth: 2 }));
            cube.add(line);

            if (b.type === 'engine') {
                const partGeo = new THREE.ConeGeometry(0.3, 0.5, 8);
                const partMat = new THREE.MeshBasicMaterial({ color: 0x222222 });
                const offsetNum = 0.3;
                cube.userData.isEngine = true;
                cube.userData.thrustDir = b.dir;
                
                const part = new THREE.Mesh(partGeo, partMat);
                const quaternion = new THREE.Quaternion();
                quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), b.dir);
                part.setRotationFromQuaternion(quaternion);
                part.position.add(b.dir.clone().multiplyScalar(offsetNum));
                cube.add(part);
            }
            else if (b.type === 'turret') {
                const partGeo = new THREE.CylinderGeometry(0.1, 0.1, 0.8, 8);
                const partMat = new THREE.MeshStandardMaterial({ color: 0xaaaaaa, metalness: 0.8 });
                const offsetNum = 0.4;
                cube.userData.isTurret = true;
                cube.userData.fireDir = b.dir;
                
                const part = new THREE.Mesh(partGeo, partMat);
                const quaternion = new THREE.Quaternion();
                quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), b.dir);
                part.setRotationFromQuaternion(quaternion);
                part.position.add(b.dir.clone().multiplyScalar(offsetNum));
                cube.add(part);
            }
            else if (b.type === 'missile') {
                cube.userData.isTurret = true;
                cube.userData.subType = 'missile';
                cube.userData.fireDir = b.dir;
                cube.userData.reloadTimer = 0;
                cube.userData.missileReloadTime = 240;

                const group = new THREE.Group();
                const quaternion = new THREE.Quaternion();
                quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), b.dir);
                group.setRotationFromQuaternion(quaternion);
                group.position.add(b.dir.clone().multiplyScalar(0.2)); 
                
                const podGeo = new THREE.BoxGeometry(0.6, 0.6, 0.8);
                const podMat = new THREE.MeshStandardMaterial({ color: 0x444444, metalness: 0.6, roughness: 0.4 });
                const pod = new THREE.Mesh(podGeo, podMat);
                group.add(pod);

                const tubeGeo = new THREE.CylinderGeometry(0.12, 0.12, 0.2, 8);
                const tubeMat = new THREE.MeshBasicMaterial({ color: 0x111111 });
                const offsets = [
                    {x: -0.15, y: 0.15}, {x: 0.15, y: 0.15},
                    {x: -0.15, y: -0.15}, {x: 0.15, y: -0.15}
                ];
                offsets.forEach(off => {
                    const tube = new THREE.Mesh(tubeGeo, tubeMat);
                    tube.rotation.x = Math.PI / 2;
                    tube.position.set(off.x, off.y, 0.4);
                    group.add(tube);
                });
                cube.add(group);
            }

            group.add(cube);
            cubesArr.push(cube);
        });
        
        enemies.push({ 
            group: group, 
            cubes: cubesArr, 
            fireTimer: Math.random() * 100,
            fireInterval: currentDifficulty.fireInterval 
        });
    }

    function updateInterceptors() {
        const state = weaponState.interceptor;
        const stats = WEAPON_STATS.interceptor;
        
        // Cooldown/Reload management
        if (state.cooldown > 0) state.cooldown--;
        if (state.reloadTimer > 0) {
            state.reloadTimer--;
            if (state.reloadTimer <= 0) state.ammo = stats.maxAmmo;
            return; // Reloading, cannot fire
        }
        if (state.ammo <= 0) {
            state.reloadTimer = stats.reloadTime;
            return;
        }
        if (state.cooldown > 0) return;

        // Target acquisition
        // Find nearest enemy missile within range
        let target = null;
        let minDist = 45; // Range
        const myPos = robotGroup.position;

        for (const b of bullets) {
            if (!b.userData.isPlayer && b.userData.isMissile) {
                const dist = b.position.distanceTo(myPos);
                if (dist < minDist) {
                    minDist = dist;
                    target = b;
                }
            }
        }

        if (target) {
            // Fire from all interceptors
            let fired = false;
            cubes.forEach(c => {
                if (c.userData.subType === 'interceptor' && !c.userData.isDead) {
                    // Fire logic
                    const startPos = c.position.clone().applyMatrix4(robotGroup.matrixWorld).add(new THREE.Vector3(0, 0.5, 0));
                    
                    // Simple lead calculation (predictive aim not strictly needed for this speed/dist, but helpful)
                    // Interceptor speed ~3.5, Missile speed ~2.0
                    // Just aim directly for now as they are fast
                    const dir = target.position.clone().sub(startPos).normalize();
                    
                    // Create Bullet
                    const bullet = new THREE.Mesh(new THREE.SphereGeometry(0.15, 4, 4), new THREE.MeshBasicMaterial({ color: 0x00ffaa }));
                    bullet.position.copy(startPos);
                    bullet.userData = { 
                        vel: dir.multiplyScalar(3.5), 
                        life: 40, 
                        isPlayer: true, 
                        isInterceptor: true,
                        damage: 0 
                    };
                    scene.add(bullet);
                    bullets.push(bullet);
                    
                    // Visuals
                    createParticle(startPos, dir.clone().multiplyScalar(0.2), 0x00ffaa, 0.2, 5);
                    
                    // Rotate dome to face target (visual only)
                    const dome = c.children[0].children[1]; // Group -> Dome
                    if (dome) {
                        // This is local rotation, might be tricky. Skip complex IK for now.
                    }
                    fired = true;
                }
            });

            if (fired) {
                state.ammo--;
                state.cooldown = stats.fireDelay;
                if (state.ammo <= 0) state.reloadTimer = stats.reloadTime;
            }
        }
    }

    function updateWeapons() {
        const types = ['normal', 'triple', 'missile', 'interceptor'];
        types.forEach(type => {
            const state = weaponState[type];
            const stats = WEAPON_STATS[type];

            // Interceptor logic handled separately in updateInterceptors, 
            // but we keep generic update here for HUD consistency if needed later
            // Actually, let's remove interceptor from here to avoid double decrement if we added logic there?
            // No, updateInterceptors handles its own decrement. 
            // BUT: reloadTimer and cooldown are decremented in updateWeapons for others.
            // Let's exclude interceptor from this generic loop or ensure updateInterceptors handles EVERYTHING for it.
            // I put full logic in updateInterceptors. So I should remove 'interceptor' from this list 
            // OR remove logic from updateInterceptors and put it here.
            // updateInterceptors is better as it needs target logic.
            
            if (type === 'interceptor') return; // Handled in updateInterceptors

            if (state.cooldown > 0) state.cooldown--;
            
            if (state.reloadTimer > 0) {
                state.reloadTimer--;
                if (state.reloadTimer <= 0) {
                    state.ammo = stats.maxAmmo;
                }
            }
        });

        // Cannon specialized update
        const cState = weaponState.cannon;
        const cStats = WEAPON_STATS.cannon;
        if (cState.cooldown > 0) cState.cooldown--;
        
        cState.reloads.forEach((t, i) => {
            if (t > 0) cState.reloads[i]--;
        });
        // Count ready charges
        cState.ammo = cState.reloads.filter(t => t <= 0).length;

        // Update Cannon UI
        for(let i=0; i<3; i++) {
             const bar = document.getElementById('c-gauge-' + (i+1));
             if (bar) {
                 const t = cState.reloads[i];
                 if (t <= 0) {
                     bar.style.width = '100%';
                     bar.style.background = '#00ff00';
                 } else {
                     const pct = 1.0 - (t / cStats.reloadTime);
                     bar.style.width = (pct * 100) + '%';
                     bar.style.background = '#ff4400';
                 }
             }
        }
        
        // Update UI
        const ammoDiv = document.getElementById('ammo-display');
        if (ammoDiv) {
            const nState = weaponState.normal;
            const tState = weaponState.triple;
            const mState = weaponState.missile;
            
            let nText = nState.reloadTimer > 0 ? "RELOAD" : nState.ammo;
            let tText = tState.reloadTimer > 0 ? "RELOAD" : tState.ammo;
            let mText = mState.reloadTimer > 0 ? "RELOAD" : mState.ammo;

            ammoDiv.innerHTML = `<span style="color:${nState.reloadTimer>0?'red':'cyan'}">NRM: ${nText}</span>` +
                                `<span style="margin-left: 10px; color:${tState.reloadTimer>0?'red':'orange'}">TRP: ${tText}</span>` + 
                                `<span style="margin-left: 10px; color:${mState.reloadTimer>0?'red':'#9933ff'}">MSL: ${mText}</span>`;
        }
    }

    function attemptFire(type) {
        const state = weaponState[type];
        const stats = WEAPON_STATS[type];

        if (state.reloadTimer > 0) return; // Reloading
        if (state.cooldown > 0) return;    // Cooling down
        if (state.ammo <= 0) {             // Out of ammo
             state.reloadTimer = stats.reloadTime;
             return;
        }

        // Fire!
        fireBullet(type); 
        state.ammo--;
        state.cooldown = stats.fireDelay;
        
        if (state.ammo <= 0) {
            state.reloadTimer = stats.reloadTime;
        }
    }

    function attemptFireCannon(mode) {
        const state = weaponState.cannon;
        const stats = WEAPON_STATS.cannon;
        
        // Find ready charges
        let readyIndices = [];
        state.reloads.forEach((t, i) => { if(t <= 0) readyIndices.push(i); });
        
        if (readyIndices.length === 0) return; // No ammo
        
        if (mode === 'single') {
            // Fire first available
            const idx = readyIndices[0];
            fireBullet('cannon');
            state.reloads[idx] = stats.reloadTime;
            state.ammo = readyIndices.length - 1; 
        } else if (mode === 'volley') {
            // Fire all available
            cannonInput.volleyQueue = readyIndices.length;
            cannonInput.volleyTimer = 8; // Start immediately (will trigger > 8 check next frame? No set to 8 to trigger immediately)
            
            // Consume all
            readyIndices.forEach(idx => {
                state.reloads[idx] = stats.reloadTime;
            });
            state.ammo = 0;
        }
    }
</script>
</body>
