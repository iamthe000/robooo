<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Space Voxel</title>
    <link rel="stylesheet" href="src/style.css">
<link rel="apple-touch-icon" href="icon192x192.png">
<link rel="icon" href="icon192x192.png">
<link rel="manifest" href="manifest.json">
</head>
<body>

<div id="canvas-container"></div>

<div id="ui-layer">
    <div id="top-bar">
        <div class="menu-group">
            <button id="save-btn" class="btn" style="position:relative;">SAVE</button>
            <button id="load-btn" class="btn" style="position:relative;">LOAD</button>
            <button id="view-btn" class="btn" style="position:relative;">VIEW</button>
            <input type="file" id="file-input" accept=".json,.svrobot,application/json,application/octet-stream">
        </div>
    <select id="difficulty-select" class="btn" style="position:relative; right:50px; background: rgba(0, 0, 0, 0.5); border: 1px solid rgba(255, 255, 255, 0.5); color: white; padding: 4px 8px; border-radius: 20px; font-weight: bold; font-size: 12px;">
        <option value="easy">EASY</option>
        <option value="normal" selected>NORMAL</option>
        <option value="hard">HARD</option>
    </select>
    <select id="graphics-select" class="btn" style="position:relative; right:40px; background: rgba(0, 0, 0, 0.5); border: 1px solid rgba(255, 255, 255, 0.5); color: white; padding: 4px 8px; border-radius: 20px; font-weight: bold; font-size: 12px;">
        <option value="low">LOW</option>
        <option value="normal" selected>NORMAL</option>
        <option value="high">HIGH</option>
        <option value="pro">PRO</option>
    </select>
        <button id="mode-btn" class="btn" style="position:relative;">BATTLE START</button>
    </div>

    <div id="view-ui" style="display:none; position:absolute; top:20px; right:20px; pointer-events:auto;">
        <button id="view-back-btn" class="btn">BACK</button>
    </div>

    <div id="palette-container">
        <div id="build-msg">SAVEで保存 / LOADで読込</div>
        
        <div id="color-palette">
            <div class="color-swatch selected" style="background:#00ccff" onclick="selectColor(0x00ccff, this)"></div>
            <div class="color-swatch" style="background:#ff0000" onclick="selectColor(0xff0000, this)"></div>
            <div class="color-swatch" style="background:#00ff00" onclick="selectColor(0x00ff00, this)"></div>
            <div class="color-swatch" style="background:#0000ff" onclick="selectColor(0x0000ff, this)"></div>
            <div class="color-swatch" style="background:#ffff00" onclick="selectColor(0xffff00, this)"></div>
            <div class="color-swatch" style="background:#ffffff" onclick="selectColor(0xffffff, this)"></div>
            <div class="color-swatch" style="background:#ff00ff" onclick="selectColor(0xff00ff, this)"></div>
            <input type="color" id="color-picker" value="#00ccff" onchange="selectColor(parseInt(this.value.replace('#','0x'),16), this)">
        </div>

        <div id="palette">
            <div id="p-normal" class="palette-item selected" onclick="selectBlock('normal')">BLOCK</div>
            <div id="p-armor" class="palette-item" onclick="selectBlock('armor')">ARMOR</div>
            <div id="p-engine" class="palette-item" onclick="selectBlock('engine')">ENGINE</div>
            <div id="p-turret" class="palette-item" onclick="selectBlock('turret')">TURRET</div>
            <div id="p-triple" class="palette-item" onclick="selectBlock('triple')">TRIPLE</div>
            <div id="p-missile" class="palette-item" onclick="selectBlock('missile')">MISSILE</div>
            <div id="p-cannon" class="palette-item" onclick="selectBlock('cannon')">CANNON</div>
            <div id="p-interceptor" class="palette-item" style="background: #334433; border-color: #00ffaa; color: #00ffaa;" onclick="selectBlock('interceptor')">INTCPT</div>
            <div id="p-wave" class="palette-item" onclick="selectBlock('wave')">WAVE</div>
            <div id="p-delete" class="palette-item" onclick="selectBlock('delete')">DEL</div>
        </div>
    </div>

    <div id="crosshair"></div>
    <div id="battle-ui">
        <div id="status-bar">
            <div id="hp-display" class="btn">HP: 100</div>
            <div id="ammo-display" class="btn">Ammo</div>
        </div>
        <div id="stick-area"><div id="stick-knob"></div></div>
        <div id="normal-btn" class="btn">NORMAL</div>
        <div id="triple-btn" class="btn">TRIPLE</div>
        <div id="missile-btn" class="btn">MISSILE</div>
        <div id="wave-btn" class="btn">WAVE</div>
        <div id="cannon-btn" class="btn">SOLID
            <div id="cannon-gauge">
                <div id="c-gauge-1"></div>
                <div id="c-gauge-2"></div>
                <div id="c-gauge-3"></div>
            </div>
        </div>
        <div id="fire-btn" class="btn">ALL FIRE</div>
        <div id="boost-btn" class="btn">BOOST</div>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://unpkg.com/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://unpkg.com/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
<script src="https://unpkg.com/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
<script src="https://unpkg.com/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://unpkg.com/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://unpkg.com/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
<script src="https://unpkg.com/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>

<script src="src/script.js"></script>
</body>
</html>
