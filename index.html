<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Space Voxel</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #1a1a1a; color: white; font-family: 'Segoe UI', sans-serif; touch-action: none; }
        #canvas-container { width: 100vw; height: 100vh; display: block; }
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
        
        .btn { position: absolute; pointer-events: auto; background: rgba(0, 0, 0, 0.5); border: 1px solid rgba(255, 255, 255, 0.5); color: white; padding: 8px 16px; border-radius: 20px; font-weight: bold; user-select: none; backdrop-filter: blur(5px); font-size: 12px; }
        .btn:active { transform: scale(0.95); background: rgba(255, 255, 255, 0.2); }
        
        
        #top-bar { position: absolute; top: 0; left: 0; width: 100%; height: 50px; display: flex; align-items: center; justify-content: space-between; padding: 0 10px; box-sizing: border-box; background: linear-gradient(to bottom, rgba(0,0,0,0.9), transparent); pointer-events: none; }
        .menu-group { display: flex; gap: 10px; pointer-events: auto; }
        
        #mode-btn { border-color: #00ccff; color: #00ccff; box-shadow: 0 0 10px rgba(0, 204, 255, 0.3); }
        #save-btn { border-color: #00ff00; color: #00ff00; }
        #load-btn { border-color: #ffff00; color: #ffff00; }

        
        #palette-container { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 5px; pointer-events: none; width: 90%; }
        #color-palette { display: flex; gap: 5px; margin-bottom: 5px; pointer-events: auto; background: rgba(0,0,0,0.5); padding: 5px; border-radius: 20px; }
        .color-swatch { width: 30px; height: 30px; border-radius: 50%; border: 2px solid #555; cursor: pointer; transition: 0.2s; }
        .color-swatch.selected { border-color: white; transform: scale(1.2); box-shadow: 0 0 8px white; }
        #color-picker { width: 30px; height: 30px; border: none; padding: 0; background: none; cursor: pointer; border-radius: 50%; overflow: hidden; }
        #palette { display: flex; gap: 10px; background: rgba(30, 30, 30, 0.9); padding: 10px; border-radius: 30px; pointer-events: auto; border: 1px solid rgba(255,255,255,0.2); overflow-x: auto; max-width: 100%; }
        .palette-item { min-width: 45px; height: 45px; border-radius: 8px; border: 2px solid #555; cursor: pointer; transition: 0.2s; position: relative; display: flex; align-items: center; justify-content: center; font-size: 10px; color: rgba(255,255,255,0.7); background: #333; }
        .palette-item.selected { border-color: white; transform: scale(1.1); z-index: 10; color: white; box-shadow: 0 0 10px white; }
        
        #p-normal { background: #00ccff; }
        #p-armor { background: #888888; }
        #p-engine { background: #ff4400; }
        #p-turret { background: #ffd700; }
        #p-triple { background: #ffaa00; }
        #p-missile { background: #9933ff; }
        #p-cannon { background: #444; border: 1px solid #aaaaaa; color: #fff; }
        #p-delete { background: #333; border-color: #ff0000; color: #ff0000; font-weight: bold; } 
        
        #build-msg { text-align: center; font-size: 12px; opacity: 0.8; text-shadow: 1px 1px 2px black; margin-bottom: 5px; }

        
        #battle-ui { display: none; width: 100%; height: 100%; }
        #stick-area { position: absolute; bottom: 40px; left: 40px; width: 120px; height: 120px; background: rgba(255,255,255,0.05); border-radius: 50%; border: 1px solid rgba(255,255,255,0.2); pointer-events: auto; }
        #stick-knob { position: absolute; top: 35px; left: 35px; width: 50px; height: 50px; background: rgba(0, 255, 255, 0.8); border-radius: 50%; pointer-events: none; box-shadow: 0 0 10px cyan; }
        #boost-btn { position: absolute; bottom: 50px; right: 40px; width: 70px; height: 70px; border-radius: 50%; background: rgba(255, 69, 0, 0.2); border: 2px solid orangered; display: flex; align-items: center; justify-content: center; font-weight: bold; pointer-events: auto; color: orangered; box-shadow: 0 0 10px orangered; }
        #fire-btn { position: absolute; bottom: 140px; right: 50px; width: 60px; height: 60px; border-radius: 50%; background: rgba(255, 215, 0, 0.2); border: 2px solid gold; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 12px; pointer-events: auto; color: gold; box-shadow: 0 0 10px gold; }
        #normal-btn { position: absolute; bottom: 50px; right: 130px; width: 60px; height: 60px; border-radius: 50%; background: rgba(0, 204, 255, 0.2); border: 2px solid #00ccff; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 10px; pointer-events: auto; color: #00ccff; box-shadow: 0 0 10px #00ccff; }
        #triple-btn { position: absolute; bottom: 140px; right: 130px; width: 60px; height: 60px; border-radius: 50%; background: rgba(255, 170, 0, 0.2); border: 2px solid #ffaa00; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 10px; pointer-events: auto; color: #ffaa00; box-shadow: 0 0 10px #ffaa00; }
        #missile-btn { position: absolute; bottom: 230px; right: 50px; width: 60px; height: 60px; border-radius: 50%; background: rgba(153, 51, 255, 0.2); border: 2px solid #9933ff; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 10px; pointer-events: auto; color: #9933ff; box-shadow: 0 0 10px #9933ff; }
        
        #cannon-btn { position: absolute; bottom: 230px; right: 130px; width: 60px; height: 60px; border-radius: 50%; background: rgba(50, 50, 50, 0.4); border: 2px solid #aaaaaa; display: flex; flex-direction: column; align-items: center; justify-content: center; font-weight: bold; font-size: 10px; pointer-events: auto; color: #aaaaaa; box-shadow: 0 0 10px #aaaaaa; }
        #cannon-gauge { display: flex; gap: 2px; margin-top: 4px; width: 40px; height: 6px; }
        #cannon-gauge div { flex: 1; background: #00ff00; height: 100%; border-radius: 2px; transition: width 0.1s, background 0.1s; }

        #crosshair { position: absolute; top: 50%; left: 50%; width: 20px; height: 20px; transform: translate(-50%, -50%); pointer-events: none; border: 1px solid rgba(255,255,255,0.5); border-radius: 50%; opacity: 0; }
        
        #status-bar { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); display: flex; gap: 10px; pointer-events: none; z-index: 100; }
        #status-bar .btn { position: relative; pointer-events: auto; min-width: 80px; text-align: center; white-space: nowrap; }

        
        #file-input { display: none; }
    </style>

<body>

<div id="canvas-container"></div>

<div id="ui-layer">
    <div id="top-bar">
        <div class="menu-group">
            <button id="save-btn" class="btn" style="position:relative;">SAVE</button>
            <button id="load-btn" class="btn" style="position:relative;">LOAD</button>
            <input type="file" id="file-input" accept=".json,.svrobot,application/json,application/octet-stream">
        </div>
    <select id="difficulty-select" class="btn" style="position:relative; right:140px; background: rgba(0, 0, 0, 0.5); border: 1px solid rgba(255, 255, 255, 0.5); color: white; padding: 4px 8px; border-radius: 20px; font-weight: bold; font-size: 12px;">
        <option value="easy">EASY</option>
        <option value="normal" selected>NORMAL</option>
        <option value="hard">HARD</option>
    </select>
        <button id="mode-btn" class="btn" style="position:relative;">BATTLE START</button>
    </div>

    <div id="palette-container">
        <div id="build-msg">SAVEで保存 / LOADで読込</div>
        
        <div id="color-palette">
            <div class="color-swatch selected" style="background:#00ccff" onclick="selectColor(0x00ccff, this)"></div>
            <div class="color-swatch" style="background:#ff0000" onclick="selectColor(0xff0000, this)"></div>
            <div class="color-swatch" style="background:#00ff00" onclick="selectColor(0x00ff00, this)"></div>
            <div class="color-swatch" style="background:#0000ff" onclick="selectColor(0x0000ff, this)"></div>
            <div class="color-swatch" style="background:#ffff00" onclick="selectColor(0xffff00, this)"></div>
            <div class="color-swatch" style="background:#ffffff" onclick="selectColor(0xffffff, this)"></div>
            <div class="color-swatch" style="background:#ff00ff" onclick="selectColor(0xff00ff, this)"></div>
            <input type="color" id="color-picker" value="#00ccff" onchange="selectColor(parseInt(this.value.replace('#','0x'),16), this)">
        </div>

        <div id="palette">
            <div id="p-normal" class="palette-item selected" onclick="selectBlock('normal')">BLOCK</div>
            <div id="p-armor" class="palette-item" onclick="selectBlock('armor')">ARMOR</div>
            <div id="p-engine" class="palette-item" onclick="selectBlock('engine')">ENGINE</div>
            <div id="p-turret" class="palette-item" onclick="selectBlock('turret')">TURRET</div>
            <div id="p-triple" class="palette-item" onclick="selectBlock('triple')">TRIPLE</div>
            <div id="p-missile" class="palette-item" onclick="selectBlock('missile')">MISSILE</div>
            <div id="p-cannon" class="palette-item" onclick="selectBlock('cannon')">CANNON</div>
            <div id="p-interceptor" class="palette-item" style="background: #334433; border-color: #00ffaa; color: #00ffaa;" onclick="selectBlock('interceptor')">INTCPT</div>
            <div id="p-delete" class="palette-item" onclick="selectBlock('delete')">DEL</div>
        </div>
    </div>

    <div id="crosshair"></div>
    <div id="battle-ui">
        <div id="status-bar">
            <div id="hp-display" class="btn">HP: 100</div>
            <div id="ammo-display" class="btn">Ammo</div>
        </div>
        <div id="stick-area"><div id="stick-knob"></div></div>
        <div id="normal-btn" class="btn">NORMAL</div>
        <div id="triple-btn" class="btn">TRIPLE</div>
        <div id="missile-btn" class="btn">MISSILE</div>
        <div id="cannon-btn" class="btn">SOLID
            <div id="cannon-gauge">
                <div id="c-gauge-1"></div>
                <div id="c-gauge-2"></div>
                <div id="c-gauge-3"></div>
            </div>
        </div>
        <div id="fire-btn" class="btn">ALL FIRE</div>
        <div id="boost-btn" class="btn">BOOST</div>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://unpkg.com/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

<script>
    
    let scene, camera, renderer, controls;
    let ghostMesh;
    let robotGroup; 
    let cubes = []; 
    let raycaster, mouse;
    let isBattleMode = false;
    let bullets = [];
    let particles = [];
    let stars, dust, gridHelper, buildGuides;
    let ambLight, dirLight;
    let enemies = [];
    let spawnTimer = 0;
    let playerHP = 100;

    
    let currentBlockType = 'normal';
    let currentBlockColor = 0x00ccff;

    
    let inputVector = { x: 0, y: 0 };
    let keys = {};
    let isBoosting = false;
    let velocity = new THREE.Vector3();
    let currentAngularVelocity = new THREE.Vector3();
    let shakeIntensity = 0;

    // Gamepad state
    let gamepadVector = { x: 0, y: 0 };
    let gamepadRightVector = { x: 0, y: 0 }; // Right Stick for Camera
    let isGamepadBoosting = false;
    let prevGamepadButtons = [];

    // Weapon Stats & State
    const WEAPON_STATS = {
        normal: { fireDelay: 15, maxAmmo: 50, reloadTime: 120 }, // Slower fire, larger mag
        triple: { fireDelay: 5, maxAmmo: 25, reloadTime: 90 },    // Fast fire, smaller mag (frequent reload)
        missile: { fireDelay: 30, maxAmmo: 1, reloadTime: 1 }, // Reload is per-block
        cannon: { fireDelay: 20, maxAmmo: 3, reloadTime: 300 }, // Long reload, limited ammo
        interceptor: { fireDelay: 4, maxAmmo: 25, reloadTime: 90 } // Fast fire, same ammo as triple
    };

    let weaponState = {
        normal: { cooldown: 0, ammo: 50, reloadTimer: 0 },
        triple: { cooldown: 0, ammo: 25, reloadTimer: 0 },
        missile: { cooldown: 0, ammo: 1, reloadTimer: 0 },
        cannon: { cooldown: 0, ammo: 3, reloads: [0, 0, 0] },
        interceptor: { cooldown: 0, ammo: 25, reloadTimer: 0 }
    };
    
    let inputState = {
        fireNormal: false,
        fireTriple: false,
        fireMissile: false,
        fireAll: false
    };
    
    let cannonInput = {
        pressTime: 0,
        isHolding: false,
        volleyActive: false,
        volleyQueue: 0,
        volleyTimer: 0
    };

    let gamepadFireState = {
        normal: false,
        triple: false,
        missile: false,
        all: false
    };

    const DIFFICULTY_SETTINGS = {
        easy: { maxEnemies: 3, spawnRate: 300, fireInterval: 200, enemyType: 'easy' },
        normal: { maxEnemies: 5, spawnRate: 200, fireInterval: 150, enemyType: 'normal' },
        hard: { maxEnemies: 10, spawnRate: 60, fireInterval: 50, enemyType: 'hard' }
    };

    let currentDifficulty = DIFFICULTY_SETTINGS.normal;

    // HUD Variables
    let sceneHUD, cameraHUD;
    let monitorGroup, monitorCubes = [];
    
    init();
    animate();

    function init() {
        scene = new THREE.Scene();
        scene.background = new THREE.Color(0x222428); 

        camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 2000);
        camera.position.set(10, 10, 10);

        renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
        renderer.autoClear = false; // Allow manual clearing for HUD overlay
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.screenSpacePanning = false;
        controls.minDistance = 5;
        controls.maxDistance = 100;

        ambLight = new THREE.AmbientLight(0xffffff, 0.8);
        scene.add(ambLight);
        dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(10, 20, 10);
        scene.add(dirLight);

        createStars();
        stars.visible = false;

        createSpaceDust();
        dust.visible = false;

        gridHelper = new THREE.GridHelper(30, 30, 0x555555, 0x333333);
        gridHelper.position.y = -2; 
        scene.add(gridHelper);

        ghostMesh = new THREE.Mesh(
            new THREE.BoxGeometry(1, 1, 1),
            new THREE.MeshBasicMaterial({ color: 0x00ff00, transparent: true, opacity: 0.5 })
        );
        ghostMesh.visible = false;
        scene.add(ghostMesh);

        createBuildGuides();

        robotGroup = new THREE.Group();
        scene.add(robotGroup);
        
        addCube(0, 0, 0, 'normal', new THREE.Vector3(0,0,1)); 

        raycaster = new THREE.Raycaster();
        mouse = new THREE.Vector2();

        window.addEventListener('resize', onWindowResize, false);
        const canvas = renderer.domElement;
        canvas.addEventListener('pointerdown', onPointerDown, false);
        canvas.addEventListener('pointermove', onPointerMove, false);
        canvas.addEventListener('pointerup', onPointerUp, false);

        window.addEventListener('keydown', e => keys[e.code] = true);
        window.addEventListener('keyup', e => keys[e.code] = false);

        document.getElementById('mode-btn').addEventListener('click', toggleMode);
        document.getElementById('save-btn').addEventListener('click', saveRobot);
        document.getElementById('load-btn').addEventListener('click', () => document.getElementById('file-input').click());
        document.getElementById('file-input').addEventListener('change', loadRobot);
        
        canvas.addEventListener('contextmenu', e => e.preventDefault());

        window.addEventListener('keydown', e => {
            if(isBattleMode) return;
            if(e.target.tagName === 'INPUT') return;

            const key = e.key;
            if(key === '1') selectBlock('normal');
            if(key === '2') selectBlock('armor');
            if(key === '3') selectBlock('engine');
            if(key === '4') selectBlock('turret');
            if(key === '5') selectBlock('triple');
            if(key === '6') selectBlock('missile');
            if(key === '7') selectBlock('cannon');
            if(key === '8') selectBlock('interceptor');
            if(key === '9') selectBlock('delete');
        });

        setupJoystick();
        setupButtons();
        initHUD();
    }

    function initHUD() {
        sceneHUD = new THREE.Scene();
        
        // Orthographic Camera for Schematic View
        // View size 20x20 units, centered
        const aspect = 1; // Square HUD
        const frustumSize = 20;
        cameraHUD = new THREE.OrthographicCamera(
            frustumSize * aspect / -2, 
            frustumSize * aspect / 2, 
            frustumSize / 2, 
            frustumSize / -2, 
            1, 
            1000
        );
        cameraHUD.position.set(20, 20, 20); // Isometric-ish view
        cameraHUD.lookAt(0, 0, 0);

        // Lights for HUD
        const ambientLight = new THREE.AmbientLight(0xffffff, 1.0);
        sceneHUD.add(ambientLight);
        
        monitorGroup = new THREE.Group();
        sceneHUD.add(monitorGroup);
    }

    function createMonitorShip() {
        // Clear previous monitor
        while(monitorGroup.children.length > 0){ 
            monitorGroup.remove(monitorGroup.children[0]); 
        }
        monitorCubes = [];

        // Create simplified clone of the ship
        // We use BasicMaterial for clear visibility of damage states
        const geometry = new THREE.BoxGeometry(1, 1, 1);
        
        cubes.forEach(c => {
            const material = new THREE.MeshBasicMaterial({ 
                color: 0x00ffff, // Default healthy color (Cyan)
                wireframe: false,
                transparent: true,
                opacity: 0.8
            });
            
            const mCube = new THREE.Mesh(geometry, material);
            mCube.position.copy(c.position);
            mCube.quaternion.copy(c.quaternion); // Match rotation for turrets/engines if we add shape details later
            
            // Store reference to the real cube
            mCube.userData = { 
                origCube: c,
                lastState: 'healthy' 
            };
            
            // Add edges for definition
            const edges = new THREE.EdgesGeometry(geometry);
            const line = new THREE.LineSegments(edges, new THREE.LineBasicMaterial({ color: 0x000000, linewidth: 1 }));
            mCube.add(line);

            monitorGroup.add(mCube);
            monitorCubes.push(mCube);
        });

        // Reset rotation
        monitorGroup.rotation.set(0, 0, 0);
    }

    function updateMonitor() {
        if (!monitorGroup) return;
        
        // Auto rotate
        monitorGroup.rotation.y += 0.01;

        monitorCubes.forEach(mCube => {
            const orig = mCube.userData.origCube;
            if (!orig) return;

            const hp = orig.userData.hp;
            const maxHp = orig.userData.maxHp;
            const isDead = orig.userData.isDead;

            // State management for efficiency
            let state = 'healthy';
            if (isDead) state = 'dead';
            else if (hp < maxHp) state = 'damaged';

            if (state !== mCube.userData.lastState || state === 'damaged') {
                mCube.userData.lastState = state;
                
                if (isDead) {
                    mCube.material.color.setHex(0x555555); // Dark Grey for lost parts
                    mCube.material.opacity = 0.2;
                    mCube.material.wireframe = true;
                } else {
                    mCube.material.wireframe = false;
                    mCube.material.opacity = 0.8;
                    
                    if (state === 'healthy') {
                        mCube.material.color.setHex(0x00ffff);
                    } else {
                        // Color lerp logic
                        // Green(00ff00) -> Yellow(ffff00) -> Red(ff0000)
                        const ratio = hp / maxHp;
                        const r = Math.min(1, 2 * (1 - ratio));
                        const g = Math.min(1, 2 * ratio);
                        mCube.material.color.setRGB(r, g, 0);
                    }
                }
            }
        });
    }

    function createStars() {
        stars = new THREE.Group();
        
        // Background layer (smaller, denser)
        const bgGeo = new THREE.BufferGeometry();
        const bgCount = 15000;
        const bgPos = new Float32Array(bgCount * 3);
        for(let i=0; i<bgCount*3; i++) {
            bgPos[i] = (Math.random() - 0.5) * 3000; 
        }
        bgGeo.setAttribute('position', new THREE.BufferAttribute(bgPos, 3));
        const bgMat = new THREE.PointsMaterial({color: 0xaaaaaa, size: 0.3, transparent: true, opacity: 0.8});
        const bgStars = new THREE.Points(bgGeo, bgMat);
        stars.add(bgStars);

        // Foreground layer (larger, brighter, fewer)
        const fgGeo = new THREE.BufferGeometry();
        const fgCount = 2000;
        const fgPos = new Float32Array(fgCount * 3);
        for(let i=0; i<fgCount*3; i++) {
            fgPos[i] = (Math.random() - 0.5) * 3000;
        }
        fgGeo.setAttribute('position', new THREE.BufferAttribute(fgPos, 3));
        const fgMat = new THREE.PointsMaterial({color: 0xffffff, size: 0.6, transparent: true, opacity: 0.9});
        const fgStars = new THREE.Points(fgGeo, fgMat);
        stars.add(fgStars);

        scene.add(stars);
    }

    function createSpaceDust() {
        const dustGeo = new THREE.BufferGeometry();
        const dustCount = 1000;
        const dustPos = new Float32Array(dustCount * 3);
        
        for(let i=0; i<dustCount*3; i+=3) {
            dustPos[i] = (Math.random() - 0.5) * 100;
            dustPos[i+1] = (Math.random() - 0.5) * 100;
            dustPos[i+2] = (Math.random() - 0.5) * 100;
        }
        
        dustGeo.setAttribute('position', new THREE.BufferAttribute(dustPos, 3));
        const dustMat = new THREE.PointsMaterial({
            color: 0xffffff, 
            size: 0.1, 
            transparent: true, 
            opacity: 0.8
        });
        
        dust = new THREE.Points(dustGeo, dustMat);
        scene.add(dust);
    }

    function createBuildGuides() {
        buildGuides = new THREE.Group();
        
        // Front Guide (Z-)
        const frontCanvas = document.createElement('canvas');
        frontCanvas.width = 256;
        frontCanvas.height = 128;
        const fCtx = frontCanvas.getContext('2d');
        fCtx.clearRect(0,0, 256, 128);
        
        fCtx.fillStyle = '#00ccff'; // Cyan
        fCtx.font = 'bold 40px Arial';
        fCtx.textAlign = 'center';
        fCtx.textBaseline = 'middle';
        fCtx.fillText("FRONT", 128, 100);
        
        // Arrow pointing UP (Forward in 3D when rotated)
        fCtx.beginPath();
        fCtx.moveTo(128, 20); // Tip
        fCtx.lineTo(168, 60);
        fCtx.lineTo(148, 60);
        fCtx.lineTo(148, 80); 
        fCtx.lineTo(108, 80);
        fCtx.lineTo(108, 60);
        fCtx.lineTo(88, 60);
        fCtx.closePath();
        fCtx.fill();
        
        const frontTex = new THREE.CanvasTexture(frontCanvas);
        const frontMat = new THREE.MeshBasicMaterial({ map: frontTex, transparent: true, side: THREE.DoubleSide, opacity: 0.6 });
        const frontPlane = new THREE.Mesh(new THREE.PlaneGeometry(8, 4), frontMat);
        frontPlane.rotation.x = -Math.PI / 2;
        frontPlane.position.set(0, -1.9, -10);
        buildGuides.add(frontPlane);

        // Back Guide (Z+)
        const backCanvas = document.createElement('canvas');
        backCanvas.width = 256;
        backCanvas.height = 128;
        const bCtx = backCanvas.getContext('2d');
        bCtx.clearRect(0,0, 256, 128);
        
        bCtx.fillStyle = '#ff4400'; // Orange
        bCtx.font = 'bold 40px Arial';
        bCtx.textAlign = 'center';
        bCtx.textBaseline = 'middle';

    const BLOCK_TYPES = ['normal', 'armor', 'engine', 'turret', 'triple', 'missile', 'cannon', 'interceptor', 'core'];
    const DIR_VECTORS = [
        {id: 0, x: 0, y: 1, z: 0}, // UP
        {id: 1, x: 0, y: -1, z: 0}, // DOWN
        {id: 2, x: 1, y: 0, z: 0}, // RIGHT
        {id: 3, x: -1, y: 0, z: 0}, // LEFT
        {id: 4, x: 0, y: 0, z: 1}, // BACK (Z+)
        {id: 5, x: 0, y: 0, z: -1} // FRONT (Z-)
    ];

    const DIR_NAMES = ["UP", "DOWN", "RIGHT", "LEFT", "BACK", "FRONT"];

    function getDirString(vec) {
        const id = getDirId(vec);
        return DIR_NAMES[id] || "UP";
    }

    function getVecFromDirString(str) {
        const idx = DIR_NAMES.indexOf(str);
        if (idx !== -1) return getDirVec(idx);
        return new THREE.Vector3(0, 1, 0);
    }

    function intToHexString(intVal) {
        return '#' + ('000000' + intVal.toString(16)).slice(-6).toUpperCase();
    }

    function hexStringToInt(str) {
        if (!str) return 0xFFFFFF;
        if (typeof str === 'number') return str; // Handle potential number input
        return parseInt(str.replace(/^#/, ''), 16);
    }

    function getDirId(vec) {
        let best = 0;
        let maxDot = -Infinity;
        // Handle both {x,y,z} and THREE.Vector3
        const v = {x: vec.x, y: vec.y, z: vec.z};
        // Normalize roughly
        const len = Math.sqrt(v.x*v.x + v.y*v.y + v.z*v.z);
        if (len > 0) { v.x/=len; v.y/=len; v.z/=len; }
        
        for(let i=0; i<DIR_VECTORS.length; i++) {
            const d = DIR_VECTORS[i];
            const dot = v.x*d.x + v.y*d.y + v.z*d.z;
            if(dot > maxDot) {
                maxDot = dot;
                best = i;
            }
        }
        return best;
    }

    function getDirVec(id) {
        const d = DIR_VECTORS[id] || DIR_VECTORS[0];
        return new THREE.Vector3(d.x, d.y, d.z);
    }

    // --- SVR Custom Format Logic ---
    function generateSVR(robotData) {
        let lines = [];
        lines.push("[SVR_HEADER]");
        lines.push("VERSION=3.0");
        lines.push("");
        
        lines.push("[PALETTE]");
        // palette is dict {id: hex}
        for (const [id, hex] of Object.entries(robotData.palette)) {
            lines.push(`${id}=${hex}`);
        }
        lines.push("");
        
        lines.push("[LAYOUT]");
        lines.push("# TYPE X Y Z COLOR_ID [DIR]");
        
        // robotData.layout is { type: [blocks...] }
        for (const [type, blocks] of Object.entries(robotData.layout)) {
            blocks.forEach(b => {
                let line = `${type.toUpperCase()} ${b.x} ${b.y} ${b.z} ${b.color}`;
                if (b.dir) {
                    line += ` ${b.dir}`;
                }
                lines.push(line);
            });
        }
        
        return lines.join("\n");
    }

    function parseSVR(text) {
        const lines = text.split(/\r?\n/);
        let section = null;
        
        const palette = {};
        const layout = {};
        
        for (let line of lines) {
            line = line.trim();
            if (!line || line.startsWith("#")) continue;
            
            if (line.startsWith("[")) {
                section = line.slice(1, -1);
                continue;
            }
            
            if (section === "PALETTE") {
                // id=hex
                const parts = line.split("=");
                if (parts.length === 2) {
                    palette[parts[0].trim()] = parts[1].trim();
                }
            } else if (section === "LAYOUT") {
                // TYPE X Y Z COLOR_ID [DIR]
                // Space separated
                const parts = line.split(/\s+/);
                if (parts.length >= 5) {
                    const type = parts[0].toLowerCase();
                    const x = parseInt(parts[1]);
                    const y = parseInt(parts[2]);
                    const z = parseInt(parts[3]);
                    const colorId = parts[4];
                    const dir = parts.length > 5 ? parts[5] : undefined;
                    
                    if (!layout[type]) layout[type] = [];
                    layout[type].push({x, y, z, color: colorId, dir});
                }
            }
        }
        
        return { palette, layout };
    }

    function encodeRobot(cubesData) { 
        // Header: SVRB (4) + Version (1) = 5 bytes
        // Block: Pos(6) + Type(1) + Dir(1) + Color(3) = 11 bytes
        const buffer = new ArrayBuffer(5 + cubesData.length * 11);
        const view = new DataView(buffer);
        let offset = 0;
        
        // Magic "SVRB"
        view.setUint8(offset++, 83); 
        view.setUint8(offset++, 86); 
        view.setUint8(offset++, 82); 
        view.setUint8(offset++, 66); 
        
        // Version
        view.setUint8(offset++, 1);
        
        cubesData.forEach(c => {
            // Pos (Int16)
            view.setInt16(offset, c.x, true); offset += 2;
            view.setInt16(offset, c.y, true); offset += 2;
            view.setInt16(offset, c.z, true); offset += 2;
            
            // Type
            let typeIdx = BLOCK_TYPES.indexOf(c.type);
            if(typeIdx === -1) typeIdx = 0;
            view.setUint8(offset++, typeIdx);
            
            // Dir
            const dirObj = c.dir || {x:0, y:1, z:0};
            view.setUint8(offset++, getDirId(dirObj));
            
            // Color (Int -> RGB)
            const col = c.color || 0xFFFFFF;
            view.setUint8(offset++, (col >> 16) & 0xFF);
            view.setUint8(offset++, (col >> 8) & 0xFF);
            view.setUint8(offset++, col & 0xFF);
        });
        
        return buffer;
    }

    function decodeRobot(buffer) {
        const view = new DataView(buffer);
        let offset = 0;
        
        // Check Magic
        if (view.getUint8(0) !== 83 || view.getUint8(1) !== 86 || view.getUint8(2) !== 82 || view.getUint8(3) !== 66) {
            throw new Error("Invalid file format");
        }
        offset += 4;
        
        const version = view.getUint8(offset++);
        if (version !== 1) throw new Error("Unsupported version");
        
        const blocks = [];
        while (offset < view.byteLength) {
            const x = view.getInt16(offset, true); offset += 2;
            const y = view.getInt16(offset, true); offset += 2;
            const z = view.getInt16(offset, true); offset += 2;
            
            const typeIdx = view.getUint8(offset++);
            const type = BLOCK_TYPES[typeIdx] || 'normal';
            
            const dirIdx = view.getUint8(offset++);
            const dir = getDirVec(dirIdx); // Returns THREE.Vector3
            
            const r = view.getUint8(offset++);
            const g = view.getUint8(offset++);
            const b = view.getUint8(offset++);
            const color = (r << 16) | (g << 8) | b;
            
            blocks.push({x, y, z, type, dir, color});
        }
        
        return blocks;
    }

    function saveRobot() {
        if(isBattleMode) return;
        
        // 1. Analyze Palette
        const paletteMap = new Map(); // hex -> id
        const palette = {}; // id -> hex
        let paletteIndex = 0;
        
        // 2. Group by Type
        const layout = {};
        
        cubes.forEach(c => {
            // Palette Logic
            const hex = intToHexString(c.userData.origColor);
            let colorId;
            if (paletteMap.has(hex)) {
                colorId = paletteMap.get(hex);
            } else {
                colorId = paletteIndex.toString();
                paletteMap.set(hex, colorId);
                palette[colorId] = hex;
                paletteIndex++;
            }
            
            // Layout Logic
            const type = c.userData.type;
            if (!layout[type]) layout[type] = [];
            
            const blockData = {
                x: Math.round(c.position.x),
                y: Math.round(c.position.y),
                z: Math.round(c.position.z),
                color: colorId
            };
            
            // Optimization: Omit default direction (UP)
            const dirStr = getDirString(c.userData.direction);
            if (dirStr !== 'UP') {
                blockData.dir = dirStr;
            }
            
            layout[type].push(blockData);
        });

        const robotData = {
            palette: palette,
            layout: layout
        };

        // Save as SVR Text Format
        const svrText = generateSVR(robotData);
        const blob = new Blob([svrText], {type: "application/octet-stream"});
        const link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.download = "my_robot.svrobot";
        link.click();
    }

    function loadRobot(event) {
        if(isBattleMode) return;
        const file = event.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(e) {
            try {
                const buffer = e.target.result;
                let data = [];
                const view = new DataView(buffer);
                
                // Check if Binary (SVRB)
                if (buffer.byteLength > 4 && 
                    view.getUint8(0) === 83 && 
                    view.getUint8(1) === 86 && 
                    view.getUint8(2) === 82 && 
                    view.getUint8(3) === 66) {
                    
                    data = decodeRobot(buffer);
                } else {
                    const decoder = new TextDecoder("utf-8");
                    const text = decoder.decode(buffer);
                    let jsonData = null;
                    let isJson = false;

                    // Try JSON Detection
                    try {
                        if (text.trim().startsWith('{') || text.trim().startsWith('[')) {
                            jsonData = JSON.parse(text);
                            isJson = true;
                        }
                    } catch(e) { isJson = false; }

                    if (isJson) {
                        if (Array.isArray(jsonData)) {
                            // Legacy Format (Array)
                            data = jsonData.map(d => {
                                let dirVec;
                                if (typeof d.dir === 'string') {
                                    dirVec = getVecFromDirString(d.dir);
                                } else if (d.dir && (typeof d.dir.x !== 'undefined')) {
                                    dirVec = new THREE.Vector3(d.dir.x, d.dir.y, d.dir.z);
                                } else {
                                    dirVec = new THREE.Vector3(0, 1, 0);
                                }
                                
                                let colorInt = d.color;
                                if (typeof d.color === 'string') {
                                    colorInt = hexStringToInt(d.color);
                                }
                                
                                return {
                                    x: d.x, y: d.y, z: d.z, 
                                    type: d.type, 
                                    color: colorInt,
                                    dir: dirVec
                                };
                            });
                        } else if (jsonData.layout) {
                            // New Format V2 (Palette + Layout JSON) - Kept for compatibility
                            const palette = jsonData.palette || {};
                            const layout = jsonData.layout;
                            
                            Object.keys(layout).forEach(type => {
                                const blocks = layout[type];
                                blocks.forEach(b => {
                                    let colorHex = palette[b.color] || b.color;
                                    if (colorHex === undefined) colorHex = '#FFFFFF';
                                    const colorInt = hexStringToInt(colorHex);
                                    
                                    const dirVec = b.dir ? getVecFromDirString(b.dir) : new THREE.Vector3(0, 1, 0);
                                    
                                    data.push({
                                        x: b.x, y: b.y, z: b.z,
                                        type: type,
                                        color: colorInt,
                                        dir: dirVec
                                    });
                                });
                            });
                        }
                    } else {
                        // Assume Custom SVR Text Format
                        const svrData = parseSVR(text);
                        const palette = svrData.palette || {};
                        const layout = svrData.layout || {};
                        
                        Object.keys(layout).forEach(type => {
                            const blocks = layout[type];
                            blocks.forEach(b => {
                                let colorHex = palette[b.color] || b.color;
                                if (colorHex === undefined) colorHex = '#FFFFFF';
                                const colorInt = hexStringToInt(colorHex);
                                
                                const dirVec = b.dir ? getVecFromDirString(b.dir) : new THREE.Vector3(0, 1, 0);
                                
                                data.push({
                                    x: b.x, y: b.y, z: b.z,
                                    type: type,
                                    color: colorInt,
                                    dir: dirVec
                                });
                            });
                        });
                    }
                }
                
                for(let i=cubes.length-1; i>=0; i--) {
                    robotGroup.remove(cubes[i]);
                }
                cubes = [];

                data.forEach(d => {
                    addCube(d.x, d.y, d.z, d.type, d.dir, d.color);
                });
                
                document.getElementById('file-input').value = '';
                
            } catch (err) {
                alert("ファイルの読み込みに失敗しました: " + err.message);
                console.error(err);
            }
        };
        reader.readAsArrayBuffer(file);
    }
